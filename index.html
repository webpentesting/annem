<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f68">
<title>İlaç Takibi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f3f7f6;--fg:#16302d;--mut:#55706c;--card:#fff;--line:#d3e2df;--teal:#1f6f68;--sun:#f5b83d;--sunfg:#3a2a00;--night:#2f3a82;--ok:#1d7a3e;--okbg:#dff3e6;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c1a;--fg:#e8f3f1;--mut:#9bb5b1;--card:#18292766;--line:#2b4440;--teal:#5fc3b8;--sun:#d9a02a;--sunfg:#1d1400;--night:#6f7be0;--ok:#7be0a0;--okbg:#17382400;--bad:#ff8f87;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1c1a;--fg:#e8f3f1;--mut:#9bb5b1;--card:#182927;--line:#2b4440;--teal:#5fc3b8;--sun:#d9a02a;--sunfg:#1d1400;--night:#6f7be0;--ok:#7be0a0;--okbg:#173824;--bad:#ff8f87;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:19px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:1.7rem;margin:6px 0 2px}
.date{color:var(--mut);margin:0 0 18px;font-size:1.05rem}
.slot{border-radius:22px;padding:18px;margin-bottom:16px;border:2px solid var(--line);background:var(--card)}
.slot h2{margin:0 0 6px;font-size:1.45rem}
.slot ul{margin:0 0 14px;padding-left:20px;color:var(--mut);font-size:1rem}
.big{width:100%;min-height:78px;border:0;border-radius:18px;font:inherit;font-size:1.35rem;font-weight:700;cursor:pointer}
.big:focus-visible,button:focus-visible,input:focus-visible{outline:4px solid var(--teal);outline-offset:3px}
.morning .big{background:var(--sun);color:var(--sunfg)}
.evening .big{background:var(--night);color:#fff}
.slot.done{background:var(--okbg);border-color:var(--ok)}
.done .big{background:transparent;color:var(--ok);cursor:default;border:0;min-height:60px}
.undo{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;font-size:.95rem;padding:10px 0 0;cursor:pointer}
.edit{margin-top:26px;border-top:2px solid var(--line);padding-top:14px}
.edit>button.toggle{background:none;border:2px solid var(--line);color:var(--fg);border-radius:14px;font:inherit;padding:12px 16px;width:100%;cursor:pointer;font-size:1.05rem}
#editor{display:none;margin-top:14px}
#editor.open{display:block}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.row .nm{flex:1 1 150px;font-weight:600}
.row label{display:flex;align-items:center;gap:6px;font-size:.95rem;color:var(--mut)}
.row input[type=checkbox]{width:22px;height:22px}
.del{background:none;border:2px solid var(--bad);color:var(--bad);border-radius:10px;padding:6px 12px;font:inherit;font-size:.95rem;cursor:pointer}
.add{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.add input[type=text]{font:inherit;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
.add .opts{display:flex;gap:18px}
.add .go{background:var(--teal);color:#fff;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;cursor:pointer}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .add .go{color:#06201d}}
:root[data-theme="dark"] .add .go{color:#06201d}
.hist{margin-top:20px;font-size:.95rem;color:var(--mut)}
.hist div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
#ov.open{display:flex}
.box{background:var(--bg);border-radius:22px;padding:22px;max-width:420px;width:100%;text-align:center}
.box p{font-size:1.35rem;margin:0 0 18px;font-weight:700}
.box button{width:100%;min-height:68px;border-radius:16px;border:0;font:inherit;font-size:1.3rem;font-weight:700;margin-top:10px;cursor:pointer}
.yes{background:var(--ok);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .yes{color:#06201d}}
:root[data-theme="dark"] .yes{color:#06201d}
.no{background:transparent;color:var(--fg);border:2px solid var(--line)!important}
</style>
</head>
<body>
<main>
  <h1 id="hi">Merhaba</h1>
  <p class="date" id="date"></p>
  <section class="slot morning" id="s-morning"></section>
  <section class="slot evening" id="s-evening"></section>
  <div class="edit">
    <button class="toggle" id="tg">İlaç listesini düzenle</button>
    <div id="editor">
      <div id="list"></div>
      <div class="add">
        <input type="text" id="nn" placeholder="Yeni ilacın adı (örn. Vitamin C 500)" aria-label="Yeni ilaç adı">
        <div class="opts">
          <label><input type="checkbox" id="nm" checked> Sabah</label>
          <label><input type="checkbox" id="ne" checked> Akşam</label>
        </div>
        <button class="go" id="addb">İlacı ekle</button>
      </div>
      <div class="hist" id="hist"></div>
    </div>
  </div>
</main>
<div id="ov" role="dialog" aria-modal="true"><div class="box"><p id="q"></p><button class="yes" id="y">Evet, içtim</button><button class="no" id="n">Hayır, vazgeç</button></div></div>
<script>
var KEY="ilac-takip-v1";
var DEF={meds:[
{id:1,n:"Kaprazdi 3 mg",m:1,e:1},{id:2,n:"Gliffor 1000 mg",m:1,e:1},{id:3,n:"Laroxyl 25",m:1,e:1},
{id:4,n:"Rexapin 5",m:1,e:1},{id:5,n:"Dulester 60",m:1,e:1},{id:6,n:"Falbiol 5 mg",m:1,e:1},
{id:7,n:"Lithurial 300",m:1,e:1},{id:8,n:"Kedaey 50",m:1,e:1},{id:9,n:"Wellbutrin XL",m:1,e:0},
{id:10,n:"Devit-3",m:1,e:1},{id:11,n:"Tardyferon",m:1,e:1}],log:{},next:12};
var S;
function load(){try{var r=localStorage.getItem(KEY);S=r?JSON.parse(r):null}catch(e){S=null}if(!S||!S.meds)S=JSON.parse(JSON.stringify(DEF))}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function hm(ts){var d=new Date(ts);return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function day(){var t=today();if(!S.log[t])S.log[t]={};return S.log[t]}
var pending=null;
function slotHtml(k){
  var title=k==="m"?"Sabah ilaçları":"Akşam ilaçları";
  var btn=k==="m"?"Sabah ilacımı içtim":"Akşam ilacımı içtim";
  var meds=S.meds.filter(function(x){return x[k]});
  var ts=(S.log[today()]||{})[k];
  var h="<h2>"+(k==="m"?"☀️ ":"🌙 ")+title+"</h2><ul>"+meds.map(function(x){return"<li>"+esc(x.n)+"</li>"}).join("")+"</ul>";
  if(ts){h+='<button class="big" disabled>✓ İçildi · saat '+hm(ts)+'</button><button class="undo" data-undo="'+k+'">Yanlışlıkla bastım</button>'}
  else h+='<button class="big" data-take="'+k+'">'+btn+'</button>';
  return h;
}
function render(){
  var d=new Date(),h=d.getHours();
  document.getElementById("hi").textContent="Armağan Hanım, "+(h<12?"günaydın":h<18?"iyi günler":"iyi akşamlar");
  document.getElementById("date").textContent=d.toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"});
  var L=day();
  ["m","e"].forEach(function(k){var el=document.getElementById(k==="m"?"s-morning":"s-evening");el.innerHTML=slotHtml(k);el.classList.toggle("done",!!L[k])});
  document.getElementById("list").innerHTML=S.meds.map(function(x){return'<div class="row"><span class="nm">'+esc(x.n)+'</span><label><input type="checkbox" data-f="m" data-id="'+x.id+'"'+(x.m?" checked":"")+'> Sabah</label><label><input type="checkbox" data-f="e" data-id="'+x.id+'"'+(x.e?" checked":"")+'> Akşam</label><button class="del" data-del="'+x.id+'">Sil</button></div>'}).join("");
  var keys=Object.keys(S.log).sort().reverse().slice(0,7);
  document.getElementById("hist").innerHTML="<strong>Son 7 gün</strong>"+keys.map(function(k){var l=S.log[k];var p=k.split("-");return"<div><span>"+p[2]+"."+p[1]+"</span><span>Sabah "+(l.m?hm(l.m):"—")+" · Akşam "+(l.e?hm(l.e):"—")+"</span></div>"}).join("");
}
document.addEventListener("click",function(ev){
  var t=ev.target;
  if(t.dataset.take){pending=t.dataset.take;document.getElementById("q").textContent=(pending==="m"?"Sabah":"Akşam")+" ilaçlarını içtin mi?";document.getElementById("ov").classList.add("open")}
  else if(t.dataset.undo){if(window.confirm("Bu kaydı silmek istiyor musun?")){delete day()[t.dataset.undo];save();render()}}
  else if(t.dataset.del){var id=+t.dataset.del;var m=S.meds.filter(function(x){return x.id===id})[0];if(m&&window.confirm(m.n+" listeden silinsin mi?")){S.meds=S.meds.filter(function(x){return x.id!==id});save();render()}}
});
document.addEventListener("change",function(ev){var t=ev.target;if(t.dataset.f){var m=S.meds.filter(function(x){return x.id===+t.dataset.id})[0];if(m){m[t.dataset.f]=t.checked?1:0;save();render()}}});
document.getElementById("y").onclick=function(){if(pending&&!day()[pending]){day()[pending]=Date.now();save()}pending=null;document.getElementById("ov").classList.remove("open");render()};
document.getElementById("n").onclick=function(){pending=null;document.getElementById("ov").classList.remove("open")};
document.getElementById("tg").onclick=function(){document.getElementById("editor").classList.toggle("open")};
document.getElementById("addb").onclick=function(){
  var i=document.getElementById("nn"),n=i.value.trim();if(!n)return;
  S.meds.push({id:S.next++,n:n,m:document.getElementById("nm").checked?1:0,e:document.getElementById("ne").checked?1:0});
  i.value="";save();render();
};
if("serviceWorker"in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
load();render();
document.addEventListener("visibilitychange",function(){if(!document.hidden)render()});
setInterval(render,60000);
</script>
</body>
</html>
